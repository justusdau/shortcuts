<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justus Shortcuts</title>
<meta name="description" content="Meine Apple-Kurzbefehle zum Herunterladen.">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #e3e3e8;
    --accent: #0071e3;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #2c2c2e;
      --accent: #2997ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  header { padding: 56px 0 24px; text-align: center; }
  header h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  header p { color: var(--muted); font-size: 1.1rem; margin: 0; }
  .search {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 28px auto 0;
    padding: 12px 16px;
    font-size: 1rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    padding: 24px 0 64px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    display: grid; place-items: center;
    font-size: 28px;
  }
  .card h2 { font-size: 1.15rem; margin: 0; }
  .card p { color: var(--muted); margin: 0; line-height: 1.45; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: .75rem;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn {
    display: inline-block;
    text-align: center;
    text-decoration: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 12px;
  }
  .btn:hover { filter: brightness(1.08); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; grid-column: 1 / -1; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 0 40px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Justus Shortcuts</h1>
      <p>Meine Kurzbefehle für iPhone, iPad und Mac – einfach antippen und hinzufügen. Immer in den Einstellen des Shortcuts gucken, ob es zu deinen Anforderungen/Einstellungen passt!</p>
      <input class="search" id="search" type="search" placeholder="Kurzbefehl suchen …" aria-label="Kurzbefehl suchen">
    </header>

    <main class="grid" id="grid">
      <div class="empty">Lade Kurzbefehle …</div>
    </main>

    <footer>Am besten auf dem iPhone oder Mac in Safari öffnen.</footer>
  </div>

<script>
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  let shortcuts = [];

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(list) {
    if (!list.length) {
      grid.innerHTML = '<div class="empty">Keine Kurzbefehle gefunden.</div>';
      return;
    }
    grid.innerHTML = list.map(s => {
      const href = s.link || s.file;
      const isFile = !s.link && s.file;
      const color = s.color || '#5e5ce6';
      return `
        <article class="card">
          <div class="icon" style="background:${esc(color)}22;color:${esc(color)}">${esc(s.emoji || '⚡️')}</div>
          <h2>${esc(s.name)}</h2>
          <p>${esc(s.description)}</p>
          ${s.tags?.length ? `<div class="tags">${s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          <a class="btn" href="${esc(href)}" ${isFile ? 'download' : 'target="_blank" rel="noopener"'}>Kurzbefehl laden</a>
        </article>`;
    }).join('');
  }

  search.addEventListener('input', () => {
    const q = search.value.toLowerCase().trim();
    render(shortcuts.filter(s =>
      [s.name, s.description, ...(s.tags || [])].join(' ').toLowerCase().includes(q)
    ));
  });

  fetch('shortcuts.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => { shortcuts = data; render(shortcuts); })
    .catch(() => {
      grid.innerHTML = '<div class="empty">shortcuts.json konnte nicht geladen werden.</div>';
    });
</script>
</body>
</html>
